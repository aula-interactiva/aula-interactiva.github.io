<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prova tècnica PDF · Aula Interactiva</title>
<style>
  body{font-family:Arial,sans-serif;background:#f5f5f5;color:#222;margin:0}
  main{max-width:650px;margin:60px auto;padding:28px;background:#fff;border:1px solid #ddd;border-radius:14px}
  h1{margin-top:0;font-size:24px}
  p{line-height:1.5;color:#555}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}
  button{padding:10px 14px;border:0;border-radius:8px;background:#222;color:#fff;font-weight:700;cursor:pointer}
  button:disabled{opacity:.45;cursor:default}
  #status{font-weight:700}
  .ok{color:#26713c}.bad{color:#a52a2a}
  a{color:#222}
</style>
</head>
<body>
<main>
  <h1>Prova tècnica de pujada de PDF</h1>
  <p>Aquesta pàgina només serveix per comprovar el circuit real de pujada de PDF amb l’alumne de prova. El fitxer i el registre es podran eliminar després.</p>
  <p id="session">Comprovant sessió…</p>
  <div class="row">
    <input id="pdf" type="file" accept="application/pdf,.pdf">
    <button id="upload" type="button" disabled>Pujar PDF de prova</button>
  </div>
  <p id="status"></p>
  <p><a href="index.html">← Tornar al portal</a></p>
</main>
<script src="tracking.js?v=41"></script>
<script>
(() => {
  const tracker = window.PracticeTracker;
  const sessionText = document.getElementById('session');
  const pdf = document.getElementById('pdf');
  const upload = document.getElementById('upload');
  const status = document.getElementById('status');
  const session = tracker?.getSession();

  if (!session || session.role !== 'student' || session.id !== '142858') {
    sessionText.textContent = 'Cal entrar primer al portal amb l’alumne de prova.';
    return;
  }

  sessionText.textContent = 'Sessió de prova correcta.';
  const refresh = () => {
    upload.disabled = !(pdf.files && pdf.files[0]);
  };
  pdf.addEventListener('change', refresh);
  refresh();

  upload.addEventListener('click', async () => {
    const file = pdf.files?.[0];
    if (!file) return;
    upload.disabled = true;
    status.className = '';
    status.textContent = 'Pujant i confirmant…';

    const submissionId = tracker.makeSubmissionId('TEST_PDF', session.id);
    const result = await tracker.uploadPdf(file, {
      practice: 'TEST PDF',
      area: 'Sistema',
      submissionId,
      testMode: true
    });

    if (result.ok && result.confirmed) {
      status.className = 'ok';
      status.textContent = 'PDF pujat i confirmat correctament.';
    } else {
      status.className = 'bad';
      status.textContent = 'La prova no s’ha pogut confirmar.';
      upload.disabled = false;
    }
  });
})();
</script>
</body>
</html>
