<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aula Interactiva</title>
<link rel="stylesheet" href="styles.css?v=15" />
<link rel="stylesheet" href="theme.css?v=5" />
</head>
<body>
<section id="login-view" class="login-view hidden">
  <div class="login-card">
    <div class="login-kicker">AULA INTERACTIVA</div>
<p>Introdueix el teu codi personal per accedir a l’aula.</p>
    <label class="login-label" for="login-id">Codi d’alumne</label>
    <div class="login-row">
      <input id="login-id" type="text" inputmode="numeric" maxlength="6" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" name="student-code" data-lpignore="true" data-1p-ignore aria-label="Codi d'alumne" placeholder="" />
      <button id="login-button" type="button">Entrar</button>
    </div>
    <div id="login-status" class="login-status" aria-live="polite"></div>
    <div class="login-note">El teu codi és personal. No el comparteixis.</div>
  </div>
</section>

<section id="hub-view" class="hidden">
  <div class="hub-shell">
    <div class="session-bar">
      <div id="teacher-tools" class="teacher-tools hidden">
        <a class="teacher-tool-link" href="https://docs.google.com/spreadsheets/d/1EEpkuCvVn-VBsLdfcz1L8QCs5pmxOhkDfGXyRyixhW4/edit#gid=310001" target="_blank" rel="noopener">Control</a>
        <a class="teacher-tool-link" href="https://docs.google.com/spreadsheets/d/1EEpkuCvVn-VBsLdfcz1L8QCs5pmxOhkDfGXyRyixhW4/edit#gid=310002" target="_blank" rel="noopener">Full de notes</a>
      </div>
      <button id="notes-button" class="session-action" type="button">Notes</button>
      <button id="messages-button" class="session-action hidden" type="button">
        Missatges <span id="messages-badge" class="message-badge hidden">0</span>
      </button>
      <span id="session-role">Alumne</span>
      <strong id="session-id"></strong>
      <button id="logout-button" type="button">Sortir</button>
    </div>
    <div class="hub-hero">
      <div>
        <div class="hub-eyebrow" id="hub-eyebrow">Introducció a l'economia</div>
        <h1 class="hub-title" id="hub-title">Pràctiques interactives</h1>
        <div class="hub-sub" id="hub-sub"></div>
        <div class="portal-area-note" id="area-note"></div>
      </div>
      <div class="hub-marks" aria-label="Selectors del portal">
        <button class="hub-mark" id="area-mark" type="button" title="Canvia a Estadística" aria-label="Canvia a Estadística">E</button>
        <button class="hub-mark" id="content-mark" type="button" title="Canvia a Apunts" aria-label="Canvia a Apunts">P</button>
      </div>
    </div>
    <section id="notes-panel" class="notes-panel hidden" aria-live="polite">
      <div class="notes-head">
        <div>
          <div class="hub-eyebrow">QUALIFICACIONS</div>
          <h2 id="notes-title">Les meves notes</h2>
        </div>
        <div class="notes-actions">
          <button class="hub-mark hidden" id="notes-area-mark" type="button" title="Canvia a Estadística" aria-label="Canvia a Estadística">E</button>
          <button id="notes-close" class="notes-close" type="button">Tancar</button>
        </div>
      </div>
      <div id="notes-practices" class="notes-practices"></div>
      <div id="notes-content" class="notes-content"></div>
    </section>
    <section id="messages-panel" class="messages-panel hidden" aria-live="polite">
      <div class="messages-head">
        <div>
          <div class="hub-eyebrow">MISSATGES</div>
          <h2 id="messages-title">Missatges</h2>
        </div>
        <button id="messages-close" class="notes-close" type="button">Tancar</button>
      </div>
      <div id="messages-teacher-compose" class="messages-compose hidden">
        <label>Destinatari</label>
        <div>
          <div id="messages-recipient-list" class="messages-recipient-list" role="group" aria-label="Destinataris"></div>
          <div class="messages-recipient-hint">Pots seleccionar més d’un alumne.</div>
        </div>
        <label for="messages-text">Missatge</label>
        <textarea id="messages-text" rows="4" maxlength="2000" placeholder="Escriu el missatge...">Bon dia. He vist que no em consta entrega de la pràctica 1 d'economia. Ja em diràs a classe si has tingut algun tipus de problema.</textarea>
        <div class="messages-compose-actions">
          <span id="messages-send-status" class="messages-send-status"></span>
          <button id="messages-send" type="button">Enviar</button>
        </div>
      </div>
      <div id="messages-list" class="messages-list"></div>
    </section>
    <div class="practice-grid" id="practice-grid"></div>
  </div>
</section>

<script src="tracking.js?v=35"></script>
<script src="portal.js?v=25"></script>
<script src="notes.js?v=8"></script>
</body>
</html>
