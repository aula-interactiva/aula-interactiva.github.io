<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pràctica 4a · Probabilitat i distribucions guiada</title>
<style>
:root{--bg:#f4f1eb;--paper:#fbfaf7;--ink:#202427;--muted:#6f7478;--line:#d8d4cc;--char:#44484c;--pale:#e8f2ee;--warn:#fff6d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}.top{background:var(--char);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff44;border-radius:8px;padding:7px 10px}.wrap{max-width:1080px;margin:auto;padding:22px}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.hero h1{margin:6px 0 8px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:850}.pill{display:inline-block;background:var(--pale);color:#285f55;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800;margin:4px 6px 0 0}.task{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:11px 0;line-height:1.5}.hint{background:var(--warn);border-left:4px solid #d6a327;padding:8px 10px;margin-top:8px;font-size:12px}.ans{margin-top:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ans input,.ans select{padding:9px;border:1px solid #d9c46f;background:#fff0b8;border-radius:8px}.ans button,.btn{border:0;border-radius:9px;background:var(--char);color:#fff;padding:9px 12px;font-weight:800}.state{font-size:12px;font-weight:800}.ok{color:#287044}.bad{color:#a54b45}.small{font-size:12px;color:var(--muted)}@media(max-width:700px){.top{display:block}.top a{display:inline-block;margin-top:8px}}
</style>
</head>
<body>
<header class="top"><b>Pràctica 4a · Probabilitat i distribucions</b><a href="../../index.html?area=estadistica">← Portal</a></header>
<main class="wrap">
<section class="hero"><div class="ey">Tema 4 · Activitat guiada</div><h1>De la probabilitat simple a la normal</h1><p>Identifica primer quin tipus de problema tens i després calcula. Les dades són individualitzades.</p><span class="pill" id="sid"></span><span class="pill">Guiada · amb pistes</span></section>
<section class="card"><div id="score"><b>0 de 8 correctes</b></div><div id="tasks"></div></section>
<section class="card"><div class="ans"><span id="submit-status" class="small">Completa correctament les 8 activitats.</span><button class="btn" id="submit" type="button" disabled>Entrega la pràctica</button></div></section>
</main>
<script src="../../tracking.js?v=19"></script>
<script>
(()=>{'use strict';
const tracker=window.PracticeTracker,$=s=>document.querySelector(s);let startedAt=Date.now(),submitted=false,defs=[];
function H(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function R(s){let x=s>>>0;return()=>{x=(1664525*x+1013904223)>>>0;return x/4294967296}}
function erf(x){const s=Math.sign(x);x=Math.abs(x);const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911,t=1/(1+p*x);return s*(1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x))}
function phi(z){return .5*(1+erf(z/Math.SQRT2))}
function V(s){return Number(String(s).trim().replace(',','.').replace('%',''))}
function make(id){const r=R(H('prob4a-'+id)),n=120+20*Math.floor(r()*5),k=Math.round(n*(.12+.18*r())),p=k/n;const total=200,form=80,inc=50,both=20;const bn=8+Math.floor(r()*5),bp=.2+.05*Math.floor(r()*5),mu=45+5*Math.floor(r()*5),sd=[8,10,12][Math.floor(r()*3)],z=.5+[0,.5,1][Math.floor(r()*3)];return[
{q:`1. De ${n} persones, ${k} han tingut una incidència. Calcula P(incidència).`,type:'num',a:p,t:.005,h:'Divideix casos favorables entre total.'},
{q:'2. Amb el resultat anterior, calcula P(no incidència).',type:'num',a:1-p,t:.005,h:'Utilitza el complement: 1−P(A).'},
{q:`3. En una taula de ${total} persones, ${form} han fet formació, ${inc} han tingut incidència i ${both} compleixen totes dues condicions. Calcula P(incidència | formació).`,type:'num',a:both/form,t:.005,h:'En una condicionada, el denominador és el grup sobre el qual condicionem.'},
{q:'4. Amb la mateixa taula, P(incidència)=0,25 i P(incidència|formació)=0,25. Quina conclusió és adequada?',type:'sel',a:'b',opts:[['a','Són dependents perquè les probabilitats són iguals.'],['b','Aquest resultat és compatible amb independència.'],['c','No es pot calcular cap probabilitat.']],h:'Compara P(B|A) amb P(B).'},
{q:`5. X~B(n=${bn}, p=${bp.toFixed(2).replace('.',',')}). Quina expressió descriu P(X=3)?`,type:'sel',a:'b',opts:[['a','3·p'],['b','C(n,3)·p³·(1−p)^(n−3)'],['c','1−p³']],h:'Exactament x èxits en n proves: combinacions × p^x × (1−p)^(n−x).'},
{q:'6. En quina situació és més natural utilitzar una distribució normal?',type:'sel',a:'c',opts:[['a','Nombre de cares en 5 llançaments.'],['b','Sí/no a una pregunta.'],['c','Temps de tramitació d’un procés continu.']],h:'La normal modelitza variables quantitatives contínues.'},
{q:`7. X~N(${mu}, ${sd}). Calcula P(X≤${(mu+z*sd).toFixed(1).replace('.',',')}).`,type:'num',a:phi(z),t:.005,h:'Tipifica: z=(x−μ)/σ i consulta l’acumulada a l’esquerra.'},
{q:`8. X~N(${mu}, ${sd}). Calcula P(X>${(mu+z*sd).toFixed(1).replace('.',',')}).`,type:'num',a:1-phi(z),t:.005,h:'És la cua dreta: 1−P(X≤x).'}]}
function render(){const s=tracker.getSession();if(!s)return;$('#sid').textContent=s.role==='teacher'?'Professor':'Alumne · ••••'+s.id.slice(-2);defs=make(s.id);$('#tasks').innerHTML=defs.map((d,i)=>`<div class="task"><b>${i+1}. ${d.q}</b><div class="hint">${d.h}</div><div class="ans">${d.type==='num'?'<input id="a'+i+'" inputmode="decimal">':'<select id="a'+i+'"><option value="">Tria...</option>'+d.opts.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('')+'</select>'}<button data-i="${i}">Comprova</button><span class="state" id="s${i}"></span></div></div>`).join('');$('#tasks').querySelectorAll('button').forEach(b=>b.onclick=()=>check(+b.dataset.i));update()}
function detail(){return defs.map((d,i)=>{const answer=$('#a'+i).value;const correct=d.type==='num'?(Number.isFinite(V(answer))&&Math.abs(V(answer)-d.a)<=d.t):answer===d.a;return{question:i+1,answer,correct}})}
function check(i){const d=detail()[i],st=$('#s'+i);st.textContent=d.correct?'Correcte':'Revisa';st.className='state '+(d.correct?'ok':'bad');update()}
function update(){const d=detail(),n=d.filter(x=>x.correct).length;$('#score').innerHTML='<b>'+n+' de '+d.length+' correctes</b>';$('#submit').disabled=submitted||n!==d.length;$('#submit-status').textContent=n===d.length?'Tot correcte. Ja pots entregar.':n+' de '+d.length+' correctes.'}
$('#submit').onclick=async()=>{const d=detail();if(submitted||d.some(x=>!x.correct))return;const s=tracker.getSession();$('#submit').disabled=true;$('#submit').textContent='Enviant…';const r=await tracker.submit({submissionId:tracker.makeSubmissionId('probabilitat-4a',s.id),id:s.id,practice:'Pràctica 4a · Probabilitat i distribucions',area:'Estadística',status:'Entregada',total:d.length,correct:d.length,attempts:1,progress:100,minutes:Math.max(1,Math.round((Date.now()-startedAt)/60000)),version:'guided-1',detail:{questions:d},justifications:[]});if(r.ok){submitted=true;document.querySelectorAll('input,select,button').forEach(x=>x.disabled=true);$('#submit').textContent='Pràctica entregada';$('#submit-status').textContent=r.teacher?'Mode professor: pràctica completada sense registrar entrega.':'Entrega registrada correctament.'}else{$('#submit').disabled=false;$('#submit').textContent='Entrega la pràctica';$('#submit-status').textContent='No s’ha pogut registrar l’entrega.'}};
render();
})();
</script>
</body></html>
