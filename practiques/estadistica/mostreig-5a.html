n class="hero"><div class="ey">Tema 5 · Activitat guiada</div><h1>De qui volem saber coses i a qui observem?</h1><p>Identifica població, mostra, unitat estadística, tipus de mostreig i possibles biaixos abans de calcular res.</p><span class="pill" id="sid"></span></section><section class="card"><div id="qs"></div></section></main><script src="../../tracking.js?v=9"></script><script>function H(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function R(s){let x=s>>>0;return()=>{x=(1664525*x+1013904223)>>>0;return x/4294967296}}function P(r,a){return a[Math.floor(r()*a.length)]}function V(s){return Number(String(s).trim().replace(',','.'))}function session(){return window.PracticeTracker?.getSession?.()||{id:'000000',role:'teacher'}}

['Per estudiar accidents es consulta només el personal del torn de matí. Quin problema pot aparèixer?',['Cobertura','Arrodoniment','Normalitat'],0,'Una part de la població no pot ser seleccionada.'],

function render(){const s=session();let h=0;for(const c of s.id)h=(h*31+c.charCodeAt(0))>>>0;const pop=1800+(h%9)*200,n=120+(h%7)*20;items[0][0]='Una empresa té '+pop+' treballadors i en selecciona '+n+' aleatòriament. Quina és la població?';items[0][1]=['Els '+n+' entrevistats','Els '+pop+' treballadors','Només els que responen'];items[1][0]='En el mateix estudi, quina és la mostra?';items[1][1]=['Els '+n+' entrevistats','Els '+pop+' treballadors','Cada departament'];sid.textContent='Codi: '+(s.role==='teacher'?'Professor '+s.id:s.id);qs.innerHTML=items.map((x,i)=>'<div class="q"><b>'+(i+1)+'. '+x[0]+'</b><div class="ans"><select id="a'+i+'"><option value="">Tria...</option>'+x[1].map((o,j)=>'<option value="'+j+'">'+o+'</option>').join('')+'</select><button onclick="ck('+i+')">Comprova</button><span id="s'+i+'"></span></div><div class="hint">'+x[3]+'</div></div>').join('')}window.ck=i=>{const x=items[i],ok=Number(document.getElementById('a'+i).value)===x[2],e=document.getElementById('s'+i);e.textContent=ok?'Correcte':'Revisa-ho';e.className=ok?'ok':'bad'};render();</script></body></html>
