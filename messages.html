<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Missatges · Aula Interactiva</title>
<link rel="stylesheet" href="styles.css?v=19" />
<style>
  .messages-page{max-width:1100px;margin:0 auto;padding:18px}
  .messages-page-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .messages-page-title{font-size:22px;font-weight:850;letter-spacing:-.02em}
  .messages-back{display:inline-flex;align-items:center;text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:8px 11px;background:#fff;color:var(--ink);font-size:11px;font-weight:800}
  .messages-panel{margin-top:0}
</style>
</head>
<body>
<main class="messages-page">
  <div class="messages-page-top">
    <a class="messages-back" href="index.html">← Tornar</a>
    <div class="messages-page-title" id="page-title">Missatges</div>
  </div>

  <section class="messages-panel" aria-live="polite">
    <div id="messages-teacher-compose" class="messages-compose hidden">
      <label>Destinataris</label>
      <div>
        <div id="messages-recipient-list" class="messages-recipient-list" role="group" aria-label="Destinataris"></div>
        <div class="messages-recipient-hint">Pots seleccionar més d’un alumne.</div>
      </div>
      <label for="messages-text">Missatge</label>
      <textarea id="messages-text" rows="4" maxlength="2000" placeholder="Escriu el missatge...">Bon dia. He vist que no em consta entrega de la pràctica 1 d'economia. Ja em diràs a classe si has tingut algun tipus de problema.</textarea>
      <div class="messages-compose-actions">
        <span id="messages-send-status" class="messages-send-status"></span>
        <button id="messages-send" type="button">Enviar</button>
      </div>
    </div>
    <div id="messages-list" class="messages-list"></div>
  </section>
</main>
<script src="tracking.js?v=44"></script>
<script src="messages.js?v=1"></script>
</body>
</html>
